name: Build and Publish
on:
  push:
    branches: [main]
    paths:
      - "main.js"
      - "preload.js"
      - "unsigned-mac-updater.js"
      - "electron-builder.config.js"
      - "package.json"
      - "config.json"
      - "portal-ui/**"
      - "local-server/**"
      - "sync/**"
      - "build/**"
      - "test/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: portal-release
  cancel-in-progress: false
jobs:
  prepare:
    # This template also lives in Equip; only the public Portal repository builds it.
    if: github.repository == 'Eqpd/Portal'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_id: ${{ steps.version.outputs.release_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test update policy before creating a release
        run: node --test test/*.test.js
      - name: Allocate a newer version and create a draft release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" > /tmp/releases.json
          node - <<'NODE'
          const fs = require('fs');
          const pkg = require('./package.json');
          const versions = [pkg.version, ...JSON.parse(fs.readFileSync('/tmp/releases.json')).map(r => r.tag_name.replace(/^v/, ''))];
          const valid = versions.filter(v => /^\d+\.\d+\.\d+$/.test(v)).sort((a,b) => {
            const x=a.split('.').map(Number), y=b.split('.').map(Number);
            return x[0]-y[0] || x[1]-y[1] || x[2]-y[2];
          });
          const [major, minor, patch] = valid.at(-1).split('.').map(Number);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${major}.${minor}.${patch+1}\n`);
          NODE
          VERSION=$(grep '^version=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2)
          ID=$(gh api "repos/$GITHUB_REPOSITORY/releases" --method POST \
            -f tag_name="v$VERSION" -f target_commitish="$GITHUB_SHA" \
            -f name="Equip Portal $VERSION" -F draft=true \
            -f body="Desktop build candidate. macOS has no Apple Developer ID certificate or notarisation. An unsigned-developer warning is not the same as a malware warning: never override a malware warning. Built from commit $GITHUB_SHA. Public release may be held while macOS distribution is investigated." --jq .id)
          echo "release_id=$ID" >> "$GITHUB_OUTPUT"
  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Set release version
        run: npm version "${{ needs.prepare.outputs.version }}" --no-git-tag-version
      - name: Install native dependencies
        run: npm install
      - name: Build and upload to draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_OWNER: Eqpd
          GH_REPO: Portal
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run build:${{ matrix.platform }} -- --publish always
      - name: Verify actual Mac signatures, not just successful packaging
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          for folder in mac mac-arm64; do
            APP="dist/$folder/Equip Portal.app"
            test -d "$APP"
            codesign --verify --deep --strict --verbose=2 "$APP"
            DETAILS=$(codesign --display --verbose=4 "$APP" 2>&1)
            printf '%s\n' "$DETAILS"
            printf '%s\n' "$DETAILS" | grep -q 'Signature=adhoc'
          done
          # These checks prove valid ad-hoc signatures, not Apple notarisation,
          # malware clearance, or permission to launch on the user's Mac.
  publish:
    needs: [prepare, build]
    if: ${{ vars.PORTAL_RELEASE_HOLD != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Publish only after macOS and Windows both succeed
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
        run: gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" --method PATCH -F draft=false
